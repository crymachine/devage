services:
  postgres:
    image: postgres:16-alpine
    container_name: devage-postgres
    environment:
      POSTGRES_USER: devage
      POSTGRES_PASSWORD: devage
      POSTGRES_DB: devage
    ports:
      - "5432:5432"
    volumes:
      - devage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devage -d devage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devage_pgdata:
